name: CI - E2E (Compose)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start compose stack
        run: docker compose -f docker-compose.yml up -d --build

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sS http://localhost:3000/api/scan-tasks -H "Authorization: Bearer admin-dev-token" >/dev/null; then
              echo "API ready"; break
            fi
            echo "Waiting for API... ($i)"; sleep 2
          done

      - name: Install API deps
        working-directory: ./api
        run: npm ci || npm install

      - name: Run e2e tests
        working-directory: ./api
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_ADMIN_TOKEN: admin-dev-token
          E2E_AGENT_TOKEN: agent-dev-token
        run: npm run test:e2e

      - name: Collect compose logs
        run: docker compose logs --no-color > compose-logs.txt || true

      - name: Upload compose logs
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt

      - name: Tear down compose
        if: always()
        run: docker compose down --volumes --remove-orphans
