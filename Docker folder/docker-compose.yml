services:
  db:
    image: postgres:16-alpine
    container_name: novisec-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: novisec
      POSTGRES_PASSWORD: novisec_secure_pass
      POSTGRES_DB: novisec_db
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novisec -d novisec_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - novisec-net

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: novisec-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: novisec
      DB_PASS: novisec_secure_pass
      DB_NAME: novisec_db
    ports:
      - "3000:3000"
    networks:
      - novisec-net

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: novisec-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "8080:80"
    networks:
      - novisec-net

  agent:
    build:
      context: .
      dockerfile: infra/docker/agent.Dockerfile
    container_name: novisec-agent
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      AGENT_ID: novisec-agent-01
      API_URL: http://api:3000
      SCAN_INTERVAL: 300
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./agent/configs:/app/configs:ro
    networks:
      - novisec-net
    profiles:
      - scanner

volumes:
  db-data:

networks:
  novisec-net:
    driver: bridge