services:
  agent:
    build: ./agent
    container_name: novisec-agent
    environment:
      - AGENT_ID=novisec-agent-001
      - API_URL=http://api:3001
      - API_TOKEN=agent-dev-token
      - TRIVY_ENABLED=true
      - SCAN_TYPE=MANUAL_GLOBAL
    volumes:
      # Accès au socket Docker en lecture seule selon le CDC (4.2)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - api
    networks:
      - novisec-net

  api:
    build: ./api
    container_name: novisec-api
    ports:
      - "3000:3001"
    environment:
      - PORT=3001
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=novisec
      - POSTGRES_PASSWORD=novisec_secure_pass
      - POSTGRES_DB=novisec_db
      - ADMIN_TOKEN=admin-dev-token
      - VIEWER_TOKEN=viewer-dev-token
      - AGENT_TOKEN=agent-dev-token
    depends_on:
      - db
    networks:
      - novisec-net

  frontend:
    build: ./web
    container_name: novisec-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    networks:
      - novisec-net

  db:
    image: postgres:16-alpine # PostgreSQL selon le CDC (4.1)
    container_name: novisec-db
    environment:
      - POSTGRES_USER=novisec
      - POSTGRES_PASSWORD=novisec_secure_pass
      - POSTGRES_DB=novisec_db
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/schema:/docker-entrypoint-initdb.d:ro
    networks:
      - novisec-net
    ports:
      - "5432:5432"

volumes:
  db-data:

networks:
  novisec-net:
    driver: bridge
