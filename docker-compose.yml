services:
  agent:
    build: ./agent
    container_name: novisec-agent
    read_only: true
    env_file:
      - .env
    tmpfs:
      - /tmp
    environment:
      - AGENT_ID=novisec-agent-001
      - API_URL=https://api:3001
      - API_CA_CERT_FILE=/certs/ca.crt
      - INSECURE_SKIP_TLS_VERIFY=false
      - API_TOKEN=${AGENT_TOKEN}
      - TRIVY_ENABLED=true
      - TRIVY_CACHE_DIR=/tmp/trivy-cache
      - SCAN_TYPE=MANUAL_GLOBAL
    volumes:
      # Accès au socket Docker en lecture seule selon le CDC (4.2)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/certs:ro
    depends_on:
      - api
    networks:
      - novisec-net

  api:
    build: ./api
    container_name: novisec-api
    ports:
      - "3002:3001"
    env_file:
      - .env
    environment:
      - PORT=3001
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - VIEWER_TOKEN=${VIEWER_TOKEN}
      - AGENT_TOKEN=${AGENT_TOKEN}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - VIEWER_USER=${VIEWER_USER}
      - VIEWER_PASSWORD=${VIEWER_PASSWORD}
      - AGENT_USER=${AGENT_USER}
      - AGENT_PASSWORD=${AGENT_PASSWORD}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET}
      - AUTH_JWT_EXPIRES_IN=8h
      - HTTPS_ENABLED=true
      - HTTPS_PFX_FILE=/certs/server.pfx
      - HTTPS_PFX_PASSPHRASE=${HTTPS_PFX_PASSPHRASE}
    depends_on:
      - db
    networks:
      - novisec-net
    volumes:
      - ./certs:/certs:ro

  frontend:
    build: ./web
    container_name: novisec-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY_TARGET=https://api:3001
      - VITE_HTTPS_ENABLED=true
      - VITE_HTTPS_KEY_FILE=/certs/server.key
      - VITE_HTTPS_CERT_FILE=/certs/server.crt
    volumes:
      - ./certs:/certs:ro
    networks:
      - novisec-net

  db:
    image: postgres:16-alpine # PostgreSQL selon le CDC (4.1)
    container_name: novisec-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/schema:/docker-entrypoint-initdb.d:ro
    networks:
      - novisec-net
    ports:
      - "5432:5432"

  cve-updater:
    image: aquasec/trivy:0.44.1
    container_name: novisec-cve-updater
    restart: unless-stopped
    networks:
      - novisec-net
    entrypoint:
      - /bin/sh
      - -c
      - while true; do trivy image --download-db-only --skip-java-db-update || true; sleep 21600; done

volumes:
  db-data:

networks:
  novisec-net:
    driver: bridge
