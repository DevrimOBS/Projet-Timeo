services:
  agent:
    build:
      context: .
      dockerfile: infra/docker/agent.Dockerfile
    container_name: novisec-agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - api
    networks:
      - novisec-net

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: novisec-api
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=novisec
      - DB_PASSWORD=novisec
      - DB_NAME=novisec_db
    depends_on:
      - db
    networks:
      - novisec-net

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: novisec-web
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - novisec-net

  db:
    image: postgres:16-alpine
    container_name: novisec-db
    environment:
      - POSTGRES_USER=novisec
      - POSTGRES_PASSWORD=novisec
      - POSTGRES_DB=novisec_db
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - novisec-net

volumes:
  db-data:

networks:
  novisec-net:
    driver: bridge
